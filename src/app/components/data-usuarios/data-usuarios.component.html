<app-navbar-admin></app-navbar-admin>
<div class="bg-white dark:bg-gray-900 min-h-screen">
  <div class="pt-10 pb-4 flex justify-center">
    <h1
      class="text-4xl font-bold text-gray-900 sm:text-5xl dark:text-white text-center"
    >
      ¡Bienvenido al apartado de gestion de
      <strong class="text-indigo-600">Usuarios</strong>!
    </h1>
  </div>
  <div class="flex justify-center py-24">
    <div class="w-full max-w-5xl overflow-x-auto">
      <p-table
        [value]="Usuarios"
        [tableStyle]="{ 'min-width': '40rem' }"
        [scrollable]="true"
      >
        <ng-template #header>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Tipo de Usuario</th>
            <th>Estatus</th>
            <th style="width: 5rem">Opcion</th>
          </tr>
        </ng-template>
        <ng-template #body let-usuario>
          <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.userName }}</td>
            <td>{{ usuario.role.name }}</td>
            <td>{{ usuario.statusUser }}</td>
            @if (usuario.statusUser != 'APROBADO') {
            <td>
              <p-button
                icon="pi pi-refresh"
                (click)="updateUser(usuario.id, StatusUser.APROBADO)"
                severity="info"
                rounded
                label="APROBAR"
              />
            </td>
            }@else {
            <td>
              <p-button
                icon="pi pi-refresh"
                (click)="updateUser(usuario.id, StatusUser.PENDIENTE)"
                severity="warn"
                rounded
                label="SUSPENDER"
              />
            </td>
            }
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="5">No hay Usuarios en el Sistema.</td>
                </tr>
              </ng-template>
      </p-table>
    </div>
  </div>
</div>
