<div class="bg-white p-6 rounded-2xl shadow-lg mt-10 mx-4 sm:mx-6 md:mx-10 lg:mx-auto max-w-4xl">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Formulario de Cambio de Diagnostico</h2>
  
    <form [formGroup]="formData" (ngSubmit)="onSubmit()">
  
      <!-- Fila 1 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-1 font-medium text-gray-700">Servicio</label>
          <input type="text" pInputText formControlName="servicio" class="w-full" placeholder="Emergencia" />
        </div>
  
        <div>
          <label class="block mb-1 font-medium text-gray-700">Expediente</label>
          <input type="text" pInputText formControlName="numExpediente" class="w-full" placeholder="EXP-000" />
        </div>
      </div>
  
      <!-- Fila 2 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-1 font-medium text-gray-700">Fecha de Alta</label>
          <p-datepicker class="w-full" formControlName="fechaAlta" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" placeholder="MM/dd/YY" />
        </div>
  
        <div>
          <label class="block mb-1 font-medium text-gray-700">Rezon de Cambio</label>
          <input type="text" pInputText formControlName="motivoNoCambio" class="w-full" />
        </div>
      </div>

      <!-- Fila 3 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-1 font-medium text-gray-700">Diagnostico de egreso (SIS)</label>
          <textarea class="w-full" rows="5" cols="30" pTextarea [autoResize]="true" formControlName="diagnosticoEgreso"></textarea>
        </div>

        <div>
          <label class="block mb-1 font-medium text-gray-700">Diagnostico de cambio</label>
          <textarea class="w-full" rows="5" cols="30" pTextarea [autoResize]="true" formControlName="diagnosticoCambiado"></textarea>
        </div>
      </div>
  
      <p-button icon="pi pi-check" type="submit" label="Enviar" [disabled]="formData.invalid" class="w-full mt-4"></p-button>
    </form>
  </div>
