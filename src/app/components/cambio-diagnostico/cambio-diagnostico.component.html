<section class="bg-white dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-4xl">
    
    <h2 class="text-2xl font-bold mb-6 text-gray-800 ">
      Formulario de Cambio de Diagnóstico
    </h2>

    <form [formGroup]="formData" (ngSubmit)="onSubmit()">

      <!-- Fila 1 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Servicio</label>
          <input type="text" pInputText formControlName="servicio"
                 class="w-full" placeholder="Emergencia" />
        </div>
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Expediente</label>
          <input type="text" pInputText formControlName="numExpediente"
                 class="w-full" placeholder="EXP-000" />
        </div>
      </div>

      <!-- Fila 2 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Fecha de Alta</label>
          <p-datepicker class="w-full"
                        formControlName="fechaAlta"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        inputId="icondisplay"
                        placeholder="MM/dd/YY"></p-datepicker>
        </div>
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Razón de Cambio</label>
          <input type="text" pInputText formControlName="motivoNoCambio"
                 class="w-full" placeholder="Describe el motivo" />
        </div>
      </div>

      <!-- Fila 3 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Diagnóstico de Egreso (SIS)</label>
          <textarea class="w-full" rows="5" pTextarea [autoResize]="true"
                    formControlName="diagnosticoEgreso"></textarea>
        </div>
        <div>
          <label class="block mb-1 font-medium text-gray-700 ">Diagnóstico de Cambio</label>
          <textarea class="w-full" rows="5" pTextarea [autoResize]="true"
                    formControlName="diagnosticoCambiado"></textarea>
        </div>
      </div>

      <!-- Botón -->
      <p-button icon="pi pi-check"
                type="submit"
                label="Enviar"
                [disabled]="formData.invalid"
                class="w-full mt-4 flex items-center justify-center gap-2"
                severity="help">
      </p-button>

    </form>
  </div>
</section>
