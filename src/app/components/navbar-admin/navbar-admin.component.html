<div class="card p-3 font-bold">
    <p-menubar [model]="items">
        <ng-template  #item let-item>
            <ng-container *ngIf="item.route; else urlRef">
                <a [routerLink]="item.route" class="p-menubar-item-link">
                    <span [class]="item.icon"></span>
                    <span class="ml-2">{{ item.label }}</span>
                </a>
            </ng-container>
            <ng-template #urlRef>
                <a *ngIf="item.url; else noLink" [href]="item.url" class="p-menubar-item-link">
                    <span [class]="item.icon"></span>
                    <span class="ml-2">{{ item.label }}</span>
                </a>
            </ng-template>
            <ng-template #noLink>
                <div class="p-menubar-item-link">
                    <span [class]="item.icon"></span>
                    <span class="ml-2">{{ item.label }}</span>
                    <span class="pi pi-fw pi-angle-down ml-2" *ngIf="item.items?.length"></span>
                </div>
            </ng-template>
        </ng-template>
        <ng-template #end>
            <div class="flex items-center gap-5">
                <div>
                    <span class="pi pi-building"></span>
                    <span>Hospital Bloom</span>
                </div>
                <div>
                    <p-button label="Cerrar sesion" (onClick)="logout()" icon="pi pi-user" variant="outlined" severity="contrast"></p-button>
                </div>
            </div>
        </ng-template>
    </p-menubar>
</div>
